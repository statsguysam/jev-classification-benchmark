  <g id="text_17">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183448" x="41.58" y="35.28" transform="rotate(-0 41.58 35.28)">Does showing Jev the suggested answer help?</text>
  </g>
  <g id="text_18">
   <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536978" x="41.58" y="64.512" transform="rotate(-0 41.58 64.512)">Same rows, examples and prompt wording | Qwen3 4B supplies the suggestion</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536978" x="181.44" y="95.76" transform="rotate(-0 181.44 95.76)">Suggestion hurts</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536978" x="517.86" y="95.76" transform="rotate(-0 517.86 95.76)">Suggestion helps</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183448" x="41.58" y="430.92" transform="rotate(-0 41.58 430.92)">Every interval includes zero. A consistent benefit is not established here.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #536978" transform="translate(41.58 442.752)">Dots show the observed change; lines show paired 95% bootstrap intervals. Zero means no accuracy change.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #536978" transform="translate(41.58 457.752)">Original primary comparison, all four datasets, four examples per class. Wider intervals mean greater uncertainty.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #536978" transform="translate(41.58 472.752)">One fixed split. These results do not establish that the two approaches are equivalent.</text>
  </g>
