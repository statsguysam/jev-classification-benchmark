  <g id="text_22">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="415.8" y="388.332" transform="rotate(-0 415.8 388.332)">● Four examples per class</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #536978" transform="translate(41.58 414.1728)">Four per class means 8 labels for Breast Cancer and SST-2, 12 for Wine, and 24 for TREC.</text>
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #536978" transform="translate(41.58 429.4728)">Original standalone Jev runs. The examples are part of the prompt; no model weights are updated.</text>
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #536978" transform="translate(41.58 444.7728)">One fixed split and example selection. Gains need not repeat with different examples or datasets.</text>
  </g>
