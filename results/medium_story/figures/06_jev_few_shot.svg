  <g id="text_20">
   <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536978" x="41.58" y="61.7472" transform="rotate(-0 41.58 61.7472)">Jev alone | Same held-out rows | No examples versus four examples per class</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #527ba1" x="226.8" y="388.332" transform="rotate(-0 226.8 388.332)">● No examples</text>
