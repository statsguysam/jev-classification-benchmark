   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183448" x="41.58" y="33.768" transform="rotate(-0 41.58 33.768)">A few examples made a large difference for Jev.</text>
