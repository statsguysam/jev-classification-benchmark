name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,numeric]' 'nbformat>=5.10,<6' 'transformers==4.57.6' 'huggingface-hub==0.36.2' 'scikit-learn==1.9.1' 'numpy==2.5.3' 'scipy==1.18.1'
      - name: CPU tensor runtime for offline helper tests
        run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Recreate frozen numeric feature bundles
        run: python scripts/tabular_data.py --datasets breast_cancer wine --output data/tabular-full --seed 42
      - name: Base tests (neural-only tests skip without optional dependencies)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -q -rs
      - name: Validate dashboard source and measured data snapshot
        run: |
          node --check dashboard/dist/app.js
          node dashboard/tests/dashboard.smoke.cjs
          node --check dashboard/dist/numeric.js
          node dashboard/tests/numeric-dashboard.smoke.cjs
          python scripts/build_expanded_numeric_dashboard.py --allow-incomplete --output /tmp/jev-numeric-dashboard-data.json
          cmp /tmp/jev-numeric-dashboard-data.json dashboard/dist/numeric-data.json
          python scripts/build_dashboard_data.py --output /tmp/jev-dashboard-data.json
          cmp /tmp/jev-dashboard-data.json dashboard/dist/data.json
      - name: Validate unexecuted notebook and source bundle
        run: |
          python - <<'PY'
          import json
          import runpy
          import zipfile
          from pathlib import Path
          import nbformat

          for notebook_path in Path('notebooks').glob('*.ipynb'):
              notebook = nbformat.read(notebook_path, as_version=4)
              nbformat.validate(notebook)
              assert all(c.get('id') for c in notebook.cells)
              assert all(not c.get('outputs') and c.get('execution_count') is None for c in notebook.cells)
          bundle = runpy.run_path('scripts/export_colab_bundle.py')['export']()
          with zipfile.ZipFile(bundle) as archive:
              names = archive.namelist()
              for name in names:
                  parts = Path(name).parts
                  assert parts[0] == 'jev-classification-benchmark'
                  assert not {'data', 'models', 'results', '.git', '.venv'} & set(parts[1:])
                  assert not any(part.startswith('.env') for part in parts)
              exported = json.loads(archive.read('jev-classification-benchmark/notebooks/colab_benchmark.ipynb'))
              nbformat.validate(exported)
          PY
