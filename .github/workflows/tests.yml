name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,numeric]' 'nbformat>=5.10,<6' 'transformers==4.57.6' 'huggingface-hub==0.36.2' 'scikit-learn==1.9.1' 'numpy==2.5.3' 'scipy==1.18.1'
      - name: CPU tensor runtime for offline helper tests
        run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify the original study archive
        run: python scripts/reproduce_frozen_study.py verify
      - name: Recreate and verify frozen prepared datasets
        run: python scripts/reproduce_frozen_study.py prepare-data --export-prepared data
      - name: Current package regression tests
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -q -rs tests/current
      - name: Portable Colab source bundle and its default tests
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python scripts/export_colab_bundle.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import zipfile

          with tempfile.TemporaryDirectory(prefix='jev-colab-tests-') as temporary:
              with zipfile.ZipFile('artifacts/jev-classification-benchmark-colab.zip') as archive:
                  archive.extractall(temporary)
              root = Path(temporary) / 'jev-classification-benchmark'
              manifest = json.loads((root / 'bundle_manifest.json').read_text())
              for name, expected in manifest['files_sha256'].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
              environment = {**os.environ, 'PYTHONPATH': str(root / 'src')}
              subprocess.run([sys.executable, '-c',
                              'from pathlib import Path; import jevbench; '
                              'assert Path(jevbench.__file__).resolve().is_relative_to(Path.cwd())'],
                             cwd=root, env=environment, check=True)
              subprocess.run([sys.executable, '-m', 'pytest', '-q', '-rs'],
                             cwd=root, env=environment, check=True)
          PY
      - name: Complete original test suite in its frozen runtime
        run: python scripts/reproduce_frozen_study.py test
      - name: Reproduce saved scientific reports and final accounting
        run: python scripts/reproduce_frozen_study.py audit
      - name: Current dashboard exporters, frontend tests and aggregate snapshots
        run: python scripts/reproduce_frozen_study.py current-dashboard
      - name: Validate notebooks have no saved outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          for path in Path('notebooks').glob('*.ipynb'):
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              assert all(cell.get('id') for cell in notebook.cells)
              assert all(not cell.get('outputs') and cell.get('execution_count') is None
                         for cell in notebook.cells)
          PY
