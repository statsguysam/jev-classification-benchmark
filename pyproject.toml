[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-classification-benchmark"
version = "0.1.0"
description = "Reproducible Jev, LLM, LoRA and classical text classification benchmarks"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "huggingface-hub>=0.34,<1", "pyarrow>=17,<24", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
neural = ["torch>=2.4,<3", "transformers>=4.45,<5", "peft>=0.13,<1", "accelerate>=1,<2"]
qlora = ["bitsandbytes>=0.43,<1"]

[project.scripts]
jevbench = "jevbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
